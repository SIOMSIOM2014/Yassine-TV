name: Deploy YOUR LOGO website
on:
  push:
    branches: [main]
    paths:
      - 'your-logo/**'
      - '.github/workflows/deploy-your-logo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-your-logo"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: your-logo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4