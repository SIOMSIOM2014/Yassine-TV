name: Build and publish YOUR LOGO Android app

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'yourlogo/**'
      - 'settings.gradle'
      - 'build.gradle'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build YOUR LOGO debug APK
        run: gradle --no-daemon :yourlogo:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUR-LOGO-v1.0.0-apk
          path: yourlogo/build/outputs/apk/debug/yourlogo-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish YOUR LOGO release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: your-logo-v1.0.0
          name: YOUR LOGO v1.0.0
          body: |
            YOUR LOGO Android app v1.0.0.
            Links are configured to remain inside the app's WebView.
            Some third-party broadcasters may restrict playback in embedded browsers.
          files: yourlogo/build/outputs/apk/debug/yourlogo-debug.apk
          make_latest: false
