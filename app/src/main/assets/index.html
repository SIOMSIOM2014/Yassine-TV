<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090d17">
<title>YACINE TV</title>
<style>
:root{color-scheme:dark;--bg:#080c15;--panel:#111827;--panel2:#182235;--line:#263248;--red:#ef233c;--red2:#bd152d;--muted:#98a5b8;--white:#f7f8fb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#202d47 0,#0b1120 42%,var(--bg) 78%);color:var(--white);font-family:Arial,Tahoma,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
.topbar{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#0b111eeb;border-bottom:1px solid #ffffff12;position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px;font-size:21px}.brandmark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#ff4057,#b90e2c);display:grid;place-items:center;box-shadow:0 5px 18px #e11d483d;font-size:21px}.brand em{font-style:normal;color:#ff4057}
.live-pill{display:flex;align-items:center;gap:7px;color:#ff6375;background:#ef233c18;border:1px solid #ef233c40;border-radius:30px;padding:8px 12px;font-size:12px;font-weight:800}.live-dot{width:7px;height:7px;background:#ff314b;border-radius:50%;box-shadow:0 0 10px #ff314b}
main{max-width:1250px;margin:auto;padding:18px 16px 36px}
.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 16px}.welcome h1{font-size:20px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted);font-size:13px}
.refresh{border:1px solid #ffffff20;background:#ffffff0b;color:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.refresh:active{transform:scale(.97)}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,1fr);gap:16px;align-items:start}
.player-card,.channels-card{background:linear-gradient(155deg,#141e30,#0f1726);border:1px solid #ffffff13;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px #0003}
.player-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #ffffff10}.now-label{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}.now-icon{color:#ff435a}.playing-name{font-size:12px;color:var(--muted);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-wrap{position:relative;background:#000;aspect-ratio:16/9}.video-wrap video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.player-status{padding:10px 14px;color:#b6c2d4;font-size:12px;min-height:37px;background:#0b1220}
.player-actions{display:flex;gap:8px;padding:12px}.action{border:1px solid #ffffff1a;background:#ffffff0b;color:#e8edf6;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:700}.action.primary{background:var(--red);border-color:var(--red);color:white}
.channels-card{padding:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{font-size:16px;margin:0}.channel-count{font-size:11px;color:#ff7181;background:#ef233c18;border-radius:20px;padding:6px 9px}
.searchbox{display:flex;align-items:center;gap:9px;background:#080e1a;border:1px solid #2a3850;border-radius:12px;padding:0 12px;margin-bottom:10px}.searchbox span{color:#8392a8}.searchbox input{width:100%;background:transparent;border:0;outline:0;color:white;padding:13px 0;font-size:13px;min-width:0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.filters select{width:100%;min-width:0;background:#182337;border:1px solid #2c3a51;border-radius:10px;color:#e8edf6;padding:10px;font-size:12px;outline:none}
.quickfilters{display:flex;gap:7px;overflow-x:auto;padding:1px 0 11px;scrollbar-width:none}.quickfilters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #2b3850;background:#111b2b;color:#b7c3d5;border-radius:30px;padding:7px 12px;font-size:11px}.chip.active{background:#ef233c20;border-color:#ef233c;color:#ff7888}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:590px;overflow:auto;padding:1px 2px 2px 1px}
.channel{min-width:0;display:flex;align-items:center;gap:9px;text-align:right;background:linear-gradient(145deg,#1b293e,#131e30);border:1px solid #ffffff0d;color:white;border-radius:12px;padding:10px 9px;min-height:67px;transition:.15s}
.channel:active{transform:scale(.98)}.channel.selected{border-color:#ef4359;background:#301b2a}
.logoimg,.logofallback{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#25334a;object-fit:contain;padding:4px}.logofallback{display:grid;place-items:center;font-size:15px;font-weight:900;color:#ff7888;background:#342033}
.channel-info{min-width:0;flex:1}.channel-info strong{display:block;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel-info small{display:block;color:#91a0b5;font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playmark{color:#ff4c63;font-size:13px}
.empty{grid-column:1/-1;color:#9ba8bb;text-align:center;padding:28px 10px;font-size:13px}
.note{color:#75839a;font-size:11px;line-height:1.8;margin:15px 3px 0}
@media(max-width:780px){main{padding:14px 11px 28px}.layout{grid-template-columns:1fr;gap:12px}.player-card{order:0}.channels-card{order:1}.grid{max-height:none;max-height:58vh}.welcome h1{font-size:18px}.topbar{height:62px;padding:0 13px}}
@media(min-width:781px){.player-card{position:sticky;top:84px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.brand{font-size:18px}.welcome p{font-size:11px}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><span class="brandmark">▶</span><span>YACINE <em>TV</em></span></div>
 <div class="live-pill"><i class="live-dot"></i> بث مباشر</div>
</header>
<main>
 <div class="welcome">
  <div><h1>مرحباً بك في YACINE TV</h1><p>شاهد قنواتك المفضلة في مكان واحد</p></div>
  <button class="refresh" id="refresh">⟳ تحديث القنوات</button>
 </div>
 <div class="layout">
  <section class="player-card">
   <div class="player-head"><div class="now-label"><span class="now-icon">●</span> المشغل المباشر</div><div class="playing-name" id="playingName">لم يتم اختيار قناة</div></div>
   <div class="video-wrap"><video id="video" controls playsinline autoplay></video></div>
   <div class="player-status" id="status" role="status">جارٍ تحميل القنوات المتاحة...</div>
   <div class="player-actions"><button class="action primary" id="reload">↻ إعادة المحاولة</button><button class="action" id="stop">■ إيقاف المشغل</button></div>
  </section>
  <section class="channels-card">
   <div class="section-title"><h2>القنوات التلفزيونية</h2><span class="channel-count" id="count">0 قناة</span></div>
   <label class="searchbox"><span>⌕</span><input id="search" placeholder="ابحث عن قناة، دولة أو لغة" autocomplete="off"></label>
   <div class="filters">
    <select id="source"><option value="all">كل القنوات المتاحة</option><option value="ma">القنوات المغربية</option><option value="fr">قنوات فرنسا</option><option value="ar">القنوات العربية</option></select>
    <select id="country"><option value="">كل الدول</option></select>
   </div>
   <div class="quickfilters"><button class="chip active" data-filter="">الكل</button><button class="chip" data-filter="sport">رياضة</button><button class="chip" data-filter="news">أخبار</button><button class="chip" data-filter="kids">أطفال</button><button class="chip" data-filter="music">موسيقى</button></div>
   <div class="grid" id="channels"><div class="empty">يتم البحث عن القنوات...</div></div>
   <p class="note">مصادر القنوات العامة قد تتغير أو تتوقف. جودة البث وتوفره يعتمدان على مصدر القناة والإنترنت.</p>
  </section>
 </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const PLAYLISTS={ma:'https://iptv-org.github.io/iptv/countries/ma.m3u',fr:'https://iptv-org.github.io/iptv/countries/fr.m3u',ar:'https://iptv-org.github.io/iptv/languages/ara.m3u'};
let allChannels=[],current=null,hls=null,activeCategory='';
const $=id=>document.getElementById(id);
function say(t){$('status').textContent=t}
function parseM3U(src){const lines=src.split(/\r?\n/),out=[];let meta='';for(const line of lines){if(line.startsWith('#EXTINF'))meta=line;else if(line.trim()&&!line.startsWith('#')&&meta){const name=(meta.split(',').pop()||'قناة').trim();const attr=k=>{const m=meta.match(new RegExp(k+'="([^"]*)"'));return m?m[1]:''};out.push({name,url:line.trim(),country:attr('tvg-country'),language:attr('tvg-language'),group:attr('group-title'),logo:attr('tvg-logo')});meta=''}}return out}
async function fetchList(key){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{const r=await fetch(PLAYLISTS[key],{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return parseM3U(await r.text())}finally{clearTimeout(timer)}}
async function load(){say('جارٍ البحث عن القنوات وتحديث القائمة...');$('channels').innerHTML='<div class="empty">يرجى الانتظار...</div>';const key=$('source').value;try{const keys=key==='all'?['ma','fr','ar']:[key];const results=await Promise.allSettled(keys.map(fetchList));const lists=results.filter(x=>x.status==='fulfilled').map(x=>x.value);if(!lists.length)throw Error('تعذر الوصول إلى مصادر القنوات');allChannels=lists.flat();const seen=new Set();allChannels=allChannels.filter(c=>{if(seen.has(c.url))return false;seen.add(c.url);return true});fillCountries();render();say('تم تحميل '+allChannels.length+' قناة. اختر قناة لبدء المشاهدة.')}catch(e){say('تعذر جلب القائمة حالياً. تحقق من الإنترنت ثم اضغط تحديث.');$('channels').innerHTML='<div class="empty">لا توجد قائمة متاحة الآن.</div>'}}
function fillCountries(){const countries=[...new Set(allChannels.map(c=>c.country).filter(Boolean))].sort();$('country').innerHTML='<option value="">كل الدول</option>'+countries.map(x=>'<option value="'+x.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+x+'</option>').join('')}
function render(){const q=$('search').value.toLowerCase(),co=$('country').value;const list=allChannels.filter(c=>{const hay=[c.name,c.country,c.language,c.group].join(' ').toLowerCase();const category=!activeCategory||hay.includes(activeCategory);return(!co||c.country===co)&&hay.includes(q)&&category});$('count').textContent=list.length+' قناة';$('channels').innerHTML='';if(!list.length){$('channels').innerHTML='<div class="empty">لم يتم العثور على قنوات مطابقة.</div>';return}const frag=document.createDocumentFragment();list.slice(0,1200).forEach(c=>{const b=document.createElement('button');b.className='channel'+(current&&current.url===c.url?' selected':'');b.type='button';if(c.logo){const im=document.createElement('img');im.className='logoimg';im.src=c.logo;im.alt='';im.loading='lazy';im.onerror=()=>{const f=document.createElement('span');f.className='logofallback';f.textContent=(c.name||'TV').slice(0,2);im.replaceWith(f)};b.appendChild(im)}else{const f=document.createElement('span');f.className='logofallback';f.textContent=(c.name||'TV').slice(0,2);b.appendChild(f)}const info=document.createElement('span');info.className='channel-info';const n=document.createElement('strong');n.textContent=c.name;const s=document.createElement('small');s.textContent=[c.country,c.language].filter(Boolean).join(' • ')||c.group||'قناة تلفزيونية';info.append(n,s);const p=document.createElement('span');p.className='playmark';p.textContent='▶';b.append(info,p);b.addEventListener('click',()=>play(c));frag.appendChild(b)});$('channels').appendChild(frag)}
function play(c){current=c;$('playingName').textContent=c.name;say('يتم تجهيز البث: '+c.name);render();const v=$('video');if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:20});hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>say('اضغط زر التشغيل لبدء القناة.')));hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)say('تعذر تشغيل هذه القناة. جرّب قناة أخرى أو أعد المحاولة.')})}else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=c.url;v.play().catch(()=>say('اضغط زر التشغيل لبدء القناة.'))}else{v.src=c.url;v.play().catch(()=>say('صيغة البث غير مدعومة في هذا الجهاز.'))}}
$('refresh').onclick=load;$('reload').onclick=()=>current?play(current):load();$('stop').onclick=()=>{if(hls){hls.destroy();hls=null}$('video').pause();say('تم إيقاف المشغل.')};$('search').oninput=render;$('country').onchange=render;$('source').onchange=load;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCategory=b.dataset.filter;render()});load();setInterval(load,30*60*1000);
</script>
</body></html>
