plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yacinetv.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.yacinetv.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'ADMOB_BANNER_ID', '"ca-app-pub-3940256099942544/9214589741"'
        }
        release {
            manifestPlaceholders = [admobAppId: 'ca-app-pub-5775721658619132~3542197639']
            buildConfigField 'String', 'ADMOB_BANNER_ID', '"ca-app-pub-5775721658619132/7587760566"'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
